<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="The Terrible Turtle — desert meets sea">
<defs>
  <radialGradient id="sky" cx="50%" cy="115%" r="120%">
    <stop offset="0%" stop-color="#3d1c0e"/><stop offset="35%" stop-color="#241a2e"/><stop offset="100%" stop-color="#0a0e1c"/>
  </radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f7e8c8"/><stop offset="35%" stop-color="#eb5833"/><stop offset="70%" stop-color="#a3623b" stop-opacity="0.55"/><stop offset="100%" stop-color="#a3623b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1d6a6e" stop-opacity="0.9"/><stop offset="100%" stop-color="#0d3a44" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8a5a2e"/><stop offset="100%" stop-color="#4a2c12"/>
  </linearGradient>
  <radialGradient id="scute0" cx="42%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#f4b95e"/><stop offset="100%" stop-color="#b0651f"/>
  </radialGradient>
  <radialGradient id="scute1" cx="42%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#e8a04a"/><stop offset="100%" stop-color="#9c5718"/>
  </radialGradient>
  <radialGradient id="scute2" cx="42%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#db9840"/><stop offset="100%" stop-color="#8a4d16"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3f7d6b"/><stop offset="100%" stop-color="#1e4a3e"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="800" fill="url(#sky)"/>
<!-- stars -->
<g fill="#f0d9b5">
  <circle cx="120" cy="90" r="1.8" opacity="0.8"/><circle cx="260" cy="60" r="1.2" opacity="0.6"/>
  <circle cx="420" cy="120" r="1.5" opacity="0.7"/><circle cx="700" cy="70" r="1.3" opacity="0.55"/>
  <circle cx="900" cy="110" r="1.8" opacity="0.8"/><circle cx="1080" cy="70" r="1.4" opacity="0.6"/>
  <circle cx="60" cy="200" r="1.2" opacity="0.5"/><circle cx="1140" cy="190" r="1.6" opacity="0.7"/>
  <circle cx="560" cy="46" r="1.1" opacity="0.5"/><circle cx="810" cy="40" r="1.4" opacity="0.6"/>
</g>
<circle cx="600" cy="660" r="330" fill="url(#sun)" opacity="0.8"/>
<!-- sea (left) and dunes (right) -->
<path d="M0,560 C180,520 320,585 480,560 C560,548 640,548 720,560 L720,800 L0,800 Z" fill="url(#sea)" opacity="0.85"/>
<path d="M0,640 C200,610 380,660 600,640 C820,620 1000,660 1200,630 L1200,800 L0,800 Z" fill="url(#dune)" opacity="0.92"/>
<path d="M640,575 C760,560 900,590 1040,570 C1110,560 1160,565 1200,558 L1200,800 L640,800 Z" fill="url(#dune)" opacity="0.75"/>
<!-- wave crests -->
<g stroke="#7fd4c1" stroke-width="3" fill="none" opacity="0.5">
  <path d="M40,600 q40,-14 80,0 t80,0 t80,0"/>
  <path d="M60,660 q40,-12 80,0 t80,0 t80,0 t80,0"/>
</g>

<!-- THE TURTLE -->
<g transform="translate(600,420)" filter="url(#glow)">
  <!-- rear flippers -->
  <path d="M-118,150 C-170,185 -200,235 -185,268 C-150,260 -105,225 -88,185 Z" fill="url(#skin)" stroke="#123128" stroke-width="3"/>
  <path d="M118,150 C170,185 200,235 185,268 C150,260 105,225 88,185 Z" fill="url(#skin)" stroke="#123128" stroke-width="3"/>
  <!-- front flippers -->
  <path d="M-150,-60 C-230,-85 -300,-70 -335,-25 C-290,5 -210,15 -150,5 Z" fill="url(#skin)" stroke="#123128" stroke-width="3"/>
  <path d="M150,-60 C230,-85 300,-70 335,-25 C290,5 210,15 150,5 Z" fill="url(#skin)" stroke="#123128" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="0" cy="-208" rx="52" ry="64" fill="url(#skin)" stroke="#123128" stroke-width="3"/>
  <circle cx="-19" cy="-222" r="7" fill="#0d221c"/><circle cx="19" cy="-222" r="7" fill="#0d221c"/>
  <circle cx="-17" cy="-224" r="2.2" fill="#f0d9b5"/><circle cx="21" cy="-224" r="2.2" fill="#f0d9b5"/>
  <path d="M-14,-186 Q0,-176 14,-186" stroke="#123128" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- shell rim -->
  <ellipse cx="0" cy="0" rx="168" ry="212" fill="#5c3317"/>
  <ellipse cx="0" cy="0" rx="156" ry="200" fill="#7c4a1e"/>
  <!-- scutes -->
  <g transform="scale(1,1)">
  <polygon points="50.2,29.0 0.0,58.0 -50.2,29.0 -50.2,-29.0 -0.0,-58.0 50.2,-29.0" fill="url(#scute0)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="49.2,-90.4 0.0,-62.0 -49.2,-90.4 -49.2,-147.3 -0.0,-175.7 49.2,-147.3" fill="url(#scute1)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="136.6,-31.0 87.4,-2.6 38.2,-31.0 38.2,-87.8 87.4,-116.3 136.6,-87.8" fill="url(#scute2)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="136.6,87.8 87.4,116.3 38.2,87.8 38.2,31.0 87.4,2.6 136.6,31.0" fill="url(#scute0)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="49.2,147.3 0.0,175.7 -49.2,147.3 -49.2,90.4 -0.0,62.0 49.2,90.4" fill="url(#scute1)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="-38.2,87.8 -87.4,116.3 -136.6,87.8 -136.6,31.0 -87.4,2.6 -38.2,31.0" fill="url(#scute2)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="-38.2,-31.0 -87.4,-2.6 -136.6,-31.0 -136.6,-87.8 -87.4,-116.3 -38.2,-87.8" fill="url(#scute0)" stroke="#5c3317" stroke-width="3" opacity="0.96"/>
  <polygon points="27.6,15.9 0.0,31.9 -27.6,15.9 -27.6,-16.0 -0.0,-31.9 27.6,-16.0" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="12.6,7.2 0.0,14.5 -12.6,7.2 -12.6,-7.3 -0.0,-14.5 12.6,-7.3" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="27.1,-103.2 0.0,-87.6 -27.1,-103.2 -27.1,-134.5 0.0,-150.1 27.1,-134.5" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="12.3,-111.7 0.0,-104.6 -12.3,-111.7 -12.3,-125.9 0.0,-133.1 12.3,-125.9" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="114.5,-43.8 87.4,-28.2 60.3,-43.8 60.3,-75.1 87.4,-90.7 114.5,-75.1" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="99.7,-52.3 87.4,-45.2 75.1,-52.3 75.1,-66.5 87.4,-73.6 99.7,-66.5" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="114.5,75.1 87.4,90.7 60.3,75.1 60.3,43.8 87.4,28.2 114.5,43.8" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="99.7,66.5 87.4,73.6 75.1,66.5 75.1,52.3 87.4,45.2 99.7,52.3" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="27.1,134.5 0.0,150.1 -27.1,134.5 -27.1,103.2 0.0,87.6 27.1,103.2" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="12.3,125.9 0.0,133.1 -12.3,125.9 -12.3,111.7 0.0,104.6 12.3,111.7" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="-60.3,75.1 -87.4,90.7 -114.5,75.1 -114.5,43.8 -87.4,28.2 -60.3,43.8" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="-75.1,66.5 -87.4,73.6 -99.7,66.5 -99.7,52.3 -87.4,45.2 -75.1,52.3" fill="#f0d9b5" opacity="0.28"/>
  <polygon points="-60.3,-43.8 -87.4,-28.2 -114.5,-43.8 -114.5,-75.1 -87.4,-90.7 -60.3,-75.1" fill="none" stroke="#7c4a1e" stroke-width="2" opacity="0.55"/>
  <polygon points="-75.1,-52.3 -87.4,-45.2 -99.7,-52.3 -99.7,-66.5 -87.4,-73.6 -75.1,-66.5" fill="#f0d9b5" opacity="0.28"/>
  </g>
</g>
<!-- dust motes -->
<g fill="#db9840" opacity="0.5">
  <circle cx="300" cy="430" r="2.5"/><circle cx="880" cy="380" r="2"/><circle cx="940" cy="500" r="2.8"/>
  <circle cx="220" cy="520" r="2"/><circle cx="1000" cy="430" r="1.8"/>
</g>
</svg>